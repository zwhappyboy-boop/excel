<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android 屏幕实时翻译工具 - 资源下载</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 460px;
            width: 100%;
            padding: 28px;
            text-align: center;
        }
        .icon-box {
            width: 64px;
            height: 64px;
            background: #eebf041a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        .desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 24px;
            text-align: left;
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #0088cc;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            background: #0088cc;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background: #0077b3;
        }
        .tip {
            margin-top: 14px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-box">🌐</div>
    <h1>Android 屏幕实时翻译工具</h1>
    
    <div class="desc">
        📌 <b>工具说明：</b><br>
        点击悬浮球，几秒内将手机屏幕上的外文游戏、漫画、视觉小说等实时翻译成中文！开源免费无广告体验。
    </div>

    <button class="btn" id="downloadBtn">🚀 点击解锁并获取下载地址</button>

    <div class="tip">提示：点击后将自动验证并跳转至 GitHub 开源发布页</div>
</div>

<script>
    // 你的 Monetag 广告链接
    const AD_LINK = "https://omg10.com/4/11847610";
    
    // 你的真实 GitHub 资源链接
    const RESOURCE_LINK = "https://github.com/ciddwd/overlay-translator";

    document.getElementById('downloadBtn').addEventListener('click', function() {
        // 1. 在新标签页打开 Monetag 广告页（产生收益）
        window.open(AD_LINK, '_blank');

        // 2. 当前页面在 1 秒后自动跳转到真实资源地址
        setTimeout(function() {
            window.location.href = RESOURCE_LINK;
        }, 1000);
    });
</script>

</body>
</html>
